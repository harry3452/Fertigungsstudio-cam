name: Rust core

on:
  push:
    paths:
      - Cargo.toml
      - crates/fertigungsstudio-cam-core/**
      - .github/workflows/rust-core.yml
  pull_request:
    paths:
      - Cargo.toml
      - crates/fertigungsstudio-cam-core/**
      - .github/workflows/rust-core.yml

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test all workspace crates
        run: cargo test --workspace --all-targets
      - name: Lint Rust core
        run: cargo clippy --workspace --all-targets -- -D warnings
