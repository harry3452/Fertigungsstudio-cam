name: Rust checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Run tests, including executable examples
        run: cargo +1.99.1 test --locked --offline --workspace --all-targets
      - name: Check Clippy
        run: cargo +1.99.1 clippy --locked --offline --workspace --all-targets -- -D warnings
      - name: Run facing demo
        run: cargo +1.99.1 run --locked --offline --example facing -- 20 10 5 2.5 6 1 3
      - name: Run experimental milling operations demo
        run: cargo +1.99.1 run --locked --offline --example milling_ops
      - name: Check preview data and builder
        run: |
          node prototype/core-path-tests.cjs
          node prototype/tool-storage-tests.cjs
          node prototype/workbench-tests.cjs
          node prototype/studio-shell-tests.cjs
          node prototype/studio-facing-tests.cjs
          node prototype/studio-wcs-tests.cjs
          node --check prototype/studio-facing.js
          node --check prototype/studio-shell.js
          node --check prototype/workbench.js
          node --check prototype/tool-library-ui.js
          node prototype/build-ribbon.cjs
          git diff --exit-code -- prototype/fertigungsstudio-kacheln.html
          node --check prototype/live-preview.js
          node --check prototype/live-server-tests.cjs
      - name: Verify Windows test launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'windows-test/Start-Fertigungsstudio-Test.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { throw ($errors | Out-String) }
      - name: Build and test local Rust preview connection
        run: |
          cargo +1.99.1 build --locked --offline --example preview_server
          node prototype/test-live.cjs

      - name: Package Windows test executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = 'dist/fertigungsstudio-cam-windows'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item 'target/debug/examples/preview_server.exe' "$dist/preview_server.exe"
          Copy-Item 'windows-test/Start-Fertigungsstudio-Test.cmd' "$dist/Start-Fertigungsstudio-Test.cmd"
          Copy-Item 'windows-test/Start-Fertigungsstudio-Test.ps1' "$dist/Start-Fertigungsstudio-Test.ps1"
          Copy-Item 'windows-test/README.txt' "$dist/README.txt"
          if (!(Test-Path "$dist/preview_server.exe")) { throw 'Windows-EXE fehlt' }
      - name: Publish Windows test package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Fertigungsstudio-CAM-Windows-Test
          path: dist/fertigungsstudio-cam-windows/
          if-no-files-found: error
          retention-days: 30
