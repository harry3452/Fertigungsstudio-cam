name: Windows native desktop update

on:
  push:
    branches:
      - feat/windows-native-desktop-webview2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows desktop executable
        shell: pwsh
        run: |
          dotnet publish windows-desktop/Fertigungsstudio.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o windows-desktop/publish
          if (!(Test-Path windows-desktop/publish/Fertigungsstudio.Desktop.exe)) { throw 'Desktop EXE fehlt' }
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $compiler)) { throw 'Inno Setup Compiler fehlt' }
          & $compiler windows-desktop/Desktop-Update.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer-Build fehlgeschlagen' }
          if (!(Test-Path windows-desktop/release/Fertigungsstudio-CAM-Desktop-Update.exe)) { throw 'Setup.exe fehlt' }
      - name: Upload update installer
        uses: actions/upload-artifact@v4
        with:
          name: Fertigungsstudio-CAM-Desktop-Update
          path: windows-desktop/release/Fertigungsstudio-CAM-Desktop-Update.exe
          if-no-files-found: error
      - name: Upload desktop program
        uses: actions/upload-artifact@v4
        with:
          name: Fertigungsstudio-CAM-Desktop-Files
          path: windows-desktop/publish/
          if-no-files-found: error
